name: CI

on:
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  ci:
    name: Run ESLint + Prettier + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Set up npm and Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check
